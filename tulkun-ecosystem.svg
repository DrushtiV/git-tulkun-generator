<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
    <style>
      .ocean { fill: #0d1117; }
      .tulkun-glow { filter: drop-shadow(0px 0px 14px #3572a5); opacity: 0.2; }
      .swimming { animation: swim 14s ease-in-out infinite alternate; }
      @keyframes swim {
        0% { transform: translate(0px, 45px) rotate(0deg); }
        100% { transform: translate(35px, 55px) rotate(1deg); }
      }
    </style>

    <rect width="800" height="300" class="ocean" rx="12" />
    <g></g>
    

    <!-- Main Dynamic Tulkun -->
    <g class="swimming tulkun-glow" transform="translate(300, 80) scale(0.75)">
      <!-- Body -->
      <ellipse cx="120" cy="60" rx="90" ry="40" fill="#3572a5" />
      <!-- Underbelly & Fins -->
      <path d="M 40 60 Q 120 110 200 60 Z" fill="#f1e05a" />
      <polygon points="120,60 70,130 140,80" fill="#e34c26" />
      <polygon points="30,60 0,15 0,105" fill="#f1e05a" />
      <!-- Eye -->
      <circle cx="180" cy="50" r="5" fill="#666666" />
    </g>
  </svg>